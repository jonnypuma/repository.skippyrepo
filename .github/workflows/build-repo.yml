name: Build Kodi Repository

on:
  push:
    branches:
      - main
    paths:
      - 'zips/**'

# Grant write access to push back to repository
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install zip tools
        run: sudo apt-get update && sudo apt-get install -y zip unzip

      - name: Build addons.xml and Extract Assets
        run: |
          echo "<?xml version='1.0' encoding='UTF-8'?>" > addons.xml
          echo "<addons>" >> addons.xml

          find zips -type f -name "*.zip" | while read -r zipfile; do
            echo "Processing: $zipfile"
            addon_dir=$(dirname "$zipfile")

            # 1. Locate and extract addon.xml safely
            XML_PATH=$(unzip -Z1 "$zipfile" | grep -i "addon.xml" | head -n 1 || true)
            if [ -n "$XML_PATH" ]; then
              unzip -p "$zipfile" "$XML_PATH" | grep -v '<?xml' >> addons.xml || true
            else
              echo "Warning: No addon.xml found in $zipfile"
            fi

            # 2. Extract icons and fanart
            unzip -j -o "$zipfile" "icon.png" "icon.jpg" "fanart.jpg" "fanart.png" "*icon.png" "*icon.jpg" "*fanart.jpg" "*fanart.png" "*/screenshot*" -d "$addon_dir" 2>/dev/null || echo "Note: Some assets not found in $zipfile"

            echo "Files in $addon_dir:"
            ls -F "$addon_dir"
          done

          echo "</addons>" >> addons.xml

      - name: Generate MD5
        run: md5sum addons.xml | awk '{print $1}' > addons.xml.md5

      - name: Update index.html version
        run: |
          NEW_VERSION=$(ls zips/repository.skippyrepo/*.zip 2>/dev/null | grep -oP '(?<=repository.skippyrepo-)[0-9.]+(?=.zip)' | head -n 1 || true)
          if [ -n "$NEW_VERSION" ] && [ -f index.html ]; then
            sed -i "s/repository.skippyrepo-[0-9.]*\.zip/repository.skippyrepo-$NEW_VERSION.zip/g" index.html
          fi

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add addons.xml addons.xml.md5
          [ -f index.html ] && git add index.html
          git add zips/

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update repo files and assets [skip ci]"
            git push origin main
          fi
